name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release checks
        run: pnpm run release:check -- --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { insec=1; next }
            insec && /^## \[/ { insec=0 }
            insec { print }
          ' CHANGELOG.md > release_notes.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("release_notes.md")
          lines = p.read_text().splitlines()
          while lines and not lines[0].strip():
              lines.pop(0)
          while lines and not lines[-1].strip():
              lines.pop()
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Pack
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: release_notes.md
          files: ./*.tgz
          draft: false
          prerelease: false
