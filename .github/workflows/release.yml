name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, semver (e.g. 1.0.1). Leave empty to publish the version in package.json."
        required: false
        type: string

# Least privilege by default. Each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  publish:
    needs: test
    if: >-
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
      && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC), no token secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships a newer npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          v="$(npm --version)"
          printf 'npm %s\n' "$v"
          lowest="$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)"
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1 and cannot use trusted publishing." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Resolve and check the version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          pkg_version="$(node -p "require('./package.json').version")"

          if [ "$EVENT" = "push" ]; then
            # Tag push: the tag must be v<package.json version>. Refuse to publish a mismatch.
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $pkg_version." >&2
              exit 1
            fi
          elif [ -n "$INPUT_VERSION" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq "$semver"; then
              echo "::error::version input is not valid semver." >&2
              exit 1
            fi
            npm version "$INPUT_VERSION" --no-git-tag-version
          fi

          echo "publishing $(node -p "require('./package.json').version")"

      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" --verify-tag --generate-notes

  publish-skipped:
    needs: test
    if: >-
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
      && vars.NPM_PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::warning::Publish skipped. Set the repository variable NPM_PUBLISH_ENABLED=true after configuring Trusted Publishing on npmjs.com."
